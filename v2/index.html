const STORAGE_PREFIX = "capcompet_conv_2oct_";

function tableKey(){
  const t = (document.getElementById("tableName").value || "defaut").trim().toLowerCase().replace(/\s+/g,"_");
  return STORAGE_PREFIX + t;
}
function loadState(){
  try{ return JSON.parse(localStorage.getItem(tableKey())) || {}; }catch(e){ return {}; }
}
function saveState(state){
  const nom = (document.getElementById("tableName").value || "").trim();
  state.meta = Object.assign({}, state.meta, {table: nom, savedAt: new Date().toISOString()});
  localStorage.setItem(tableKey(), JSON.stringify(state));
}
let STATE = {};

function initTableName(){
  const saved = localStorage.getItem(STORAGE_PREFIX + "_current_table");
  if(saved) document.getElementById("tableName").value = saved;
  document.getElementById("tableName").addEventListener("input", ()=>{
    localStorage.setItem(STORAGE_PREFIX + "_current_table", document.getElementById("tableName").value);
    STATE = loadState();
    render();
  });
}

/* ---------------------- Rendu de la navigation ---------------------- */
function renderNav(){

  nav.innerHTML = "";
  if(animateurMode){ nav.style.display = "none"; return; }
  nav.style.display = "flex";
  STEPS.forEach((s, i)=>{

    b.className = s.id === currentStep ? "active" : "";
    b.innerHTML = `<span class="n">${i+1}</span>${s.label.split(" · ")[1]}`;

  });

/* ---------------------- Étape 1 : PAC -------------------------------- */
function calcPAC(v){
  const OBJECTIF = 6000000, ETP = 2.5, H_MOIS = 150, RENDEMENT = 0.8, NB_MOIS = 12;
  const COEF_VERT = 1.2, FACTEUR_ROSE = 1.3;
  const MARGES = {V:0.06, O:0.04, R:0.02};
  const RESSOURCES = ETP * H_MOIS * RENDEMENT * NB_MOIS; // 3600 h/an
  const C10 = (8000000/12) * NB_MOIS; // = 8 000 000
  const C11 = ETP * C10;
  const baseEurH = C11 / RESSOURCES; // Moy €chiffrés/h

  const objV = v.pv/100 * OBJECTIF, objO = v.po/100 * OBJECTIF, objR = v.pr/100 * OBJECTIF;
  const tV = v.tv/100, tO = v.to/100, tR = v.tr/100;
  const volV = tV ? objV/tV : 0, volO = tO ? objO/tO : 0, volR = tR ? objR/tR : 0;

  const ehV = baseEurH * COEF_VERT;
  const ehR = FACTEUR_ROSE * baseEurH;
  const hV = ehV ? volV/ehV : 0;
  const hR = ehR ? volR/ehR : 0;
  const hO = Math.max(RESSOURCES - hV - hR, 0.0001);
  const ehO = volO / hO;

  const mnV = MARGES.V * objV, mnO = MARGES.O * objO, mnR = MARGES.R * objR;
  const mnTotal = mnV + mnO + mnR;

  return {RESSOURCES, ehV, ehO, ehR, hV, hO, hR, objV, objO, objR, mnV, mnO, mnR, mnTotal};
}

/* ---------------------- Étape 3 : Score Échiquier ----------------------
   Fusionne le dossier de presse (support de lecture) et la grille de
   score : les deux ne forment qu'une seule étape dans le déroulé de la
   note de cadrage v3 (« Support à distribuer aux tables à l'étape 3 »). */
function stepScore(){
  const s = STATE.score || {};
  const rows = SCORE_CRITERES.map((c,i)=>{
    const v = s[i] ?? "";
    const opts = [0,1,2,3,4,5].map(n=>`<option value="${n}" ${String(v)===String(n)?"selected":""}>${n}</option>`).join("");
    return `<div class="score-row"><div class="lbl">${c}</div><select data-i="${i}"><option value="" ${v===""?"selected":""}>–</option>${opts}</select></div>`;
  }).join("");
  const total = SCORE_CRITERES.reduce((a,_,i)=> a + (Number(s[i])||0), 0);
  const answered = SCORE_CRITERES.filter((_,i)=> s[i] !== undefined && s[i] !== "").length;
  let baro = "", baroClass = "";
  if(answered < SCORE_CRITERES.length){ baro = "Grille incomplète"; baroClass = ""; }
  else if(total < 10){ baro = "STOP : identifier les enjeux d'abord"; baroClass = "bar-stop"; }
  else if(total < 25){ baro = "À approfondir avant Go"; baroClass = "bar-warn"; }
  else { baro = "Dossier suffisamment qualifié"; baroClass = "bar-go"; }
  const reperes = REPERES_ARTICLE.map(([crit,suggere])=>`<tr><td>${crit}</td><td>${suggere}</td></tr>`).join("");
  return `
  <div class="card">
    <h2>Étape 3 — Dossier de presse : LA FRITE DORÉE</h2>
    <div class="meta">${ARTICLE_PRESSE.source}</div>
    <div class="article">
      <h3>${ARTICLE_PRESSE.titre}</h3>
      ${ARTICLE_PRESSE.corps.map(p=>`<p>${p}</p>`).join("")}
    </div>
    <div class="reperes-wrap">
      <table class="reperes">
        <thead><tr><th>Critère (grille /40)</th><th>Ce que l'article suggère</th></tr></thead>
        <tbody>${reperes}</tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <h2>Score Échiquier</h2>
    <div class="meta">8 critères, notés de 0 à 5, à partir du seul dossier de presse ci-dessus</div>
    ${rows}
    <div class="kpi"><div class="box"><div class="v">${total} / 40</div><div class="l">Score total</div></div></div>
    ${baroClass ? `<div class="barometre ${baroClass}">${baro}</div>` : `<div class="save-note">${baro}</div>`}
  </div>`;
}
function bindScore(){
  document.querySelectorAll(".score-row select").forEach(sel=>{
    sel.addEventListener("change", e=>{
      STATE.score = STATE.score || {};
      STATE.score[e.target.dataset.i] = e.target.value;
      saveState(STATE);
      document.getElementById("app").innerHTML = stepScore();
      bindScore();
    });
  });
}

/* ---------------------- Export / Import (par table) ---------------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const t = document.getElementById("tableName").value || "table";
  a.href = url; a.download = `cap-competitivite-${t.replace(/\s+/g,"_")}-2oct.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      STATE = JSON.parse(reader.result);
      saveState(STATE);
      render();
    }catch(e){ alert("Fichier illisible."); }
  };
  reader.readAsText(file);
}

/* ---------------------- Vue animateur : bilan multi-tables ---------------------- */
function summarizeTableState(state, fallbackName){
  const nom = (state.meta && state.meta.table) || fallbackName || "(table inconnue)";
  const pac = state.pac || {pv:35, po:48, pr:17, tv:50, to:30, tr:20};
  const r = calcPAC(pac);
  const territoire = state.territoire || {};
  const nogoCount = Object.values(territoire).filter(v=>v==="NO GO").length;
  const couleurFilRouge = territoire[DOSSIER_FIL_ROUGE_N] || "—";
  const score = state.score || {};
  const scoreTotal = SCORE_CRITERES.reduce((a,_,i)=> a + (Number(score[i])||0), 0);
  const gonogo = (state.gonogo && state.gonogo.decision) || "—";
  const mission = state.mission || {};
  return {
    nom,
    margeNette: Math.round(r.mnTotal),
    nogoCount,
    couleurFilRouge,
    scoreTotal,
    gonogo,
    missionCouleur: mission.couleur || "—",
    missionNiveau: mission.niveau || "—",
    missionHeures: mission.heures || "—",
  };
}

let bilanRows = [];

function stepBilan(){
  const rowsHtml = bilanRows.map(r=>`
    <tr>
      <td><strong>${r.nom}</strong></td>
      <td>${r.margeNette.toLocaleString("fr-FR")} €</td>
      <td class="count-nogo ${r.nogoCount>=5?"ok":"low"}">${r.nogoCount} / 5</td>
      <td><span class="pill couleur-select" data-c="${r.couleurFilRouge}" style="padding:2px 8px;">${r.couleurFilRouge}</span></td>
      <td>${r.scoreTotal} / 40</td>
      <td>${r.gonogo}</td>
      <td>${r.missionCouleur}</td>
      <td>${r.missionNiveau}</td>
      <td>${r.missionHeures}</td>
    </tr>`).join("");
  const kpiMoyenne = bilanRows.length ? Math.round(bilanRows.reduce((a,r)=>a+r.margeNette,0)/bilanRows.length) : 0;
  return `
  <div class="card">
    <h2>Vue animateur — Tableau de bord de clôture</h2>
    <div class="meta">Importez les fichiers JSON exportés par chaque table (bouton « Exporter » de chaque poste) pour les comparer en plénière.</div>
    <label>Importer un ou plusieurs exports de table</label>
    <div class="drop-zone" id="bilanDrop">Cliquez ici pour choisir un ou plusieurs fichiers .json exportés par les tables</div>
    <input type="file" id="bilanFiles" accept="application/json" multiple hidden>
    ${bilanRows.length ? `
    <div class="kpi">
      <div class="box"><div class="v">${bilanRows.length}</div><div class="l">Tables importées</div></div>
      <div class="box"><div class="v">${kpiMoyenne.toLocaleString("fr-FR")} €</div><div class="l">Marge nette moyenne (étape 1)</div></div>
    </div>
    <div class="bilan-table-wrap">
      <table class="bilan">
        <thead><tr>
          <th>Table</th><th>Marge nette PAC</th><th>Dont NO GO</th>
          <th>Couleur donnée au dossier fil rouge (n°${DOSSIER_FIL_ROUGE_N})</th>
          <th>Score Échiquier</th><th>Go/No-Go</th>
          <th>Mission — couleur</th><th>Mission — niveau</th><th>Mission — heures</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>` : `<div class="save-note" style="margin-top:14px;">Aucun fichier importé pour l'instant.</div>`}
  </div>
  <div class="btn-row">
    <button class="btn secondary" id="btnRetourStagiaire">← Retour au parcours stagiaire</button>
  </div>`;
}
function bindBilan(){
  const dropZone = document.getElementById("bilanDrop");
  const filesInput = document.getElementById("bilanFiles");
  dropZone.addEventListener("click", ()=> filesInput.click());
  filesInput.addEventListener("change", e=>{
    const files = Array.from(e.target.files || []);
    let pending = files.length;
    if(!pending) return;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          const fallback = file.name.replace(/^cap-competitivite-/,"").replace(/-2oct\.json$/,"").replace(/\.json$/,"");
          bilanRows.push(summarizeTableState(parsed, fallback));
        }catch(err){ /* fichier ignoré s'il est illisible */ }
        pending--;
        if(pending === 0){
          document.getElementById("app").innerHTML = stepBilan();
          bindBilan();
        }
      };
      reader.readAsText(file);
    });
  });
  document.getElementById("btnRetourStagiaire").addEventListener("click", ()=>{
    animateurMode = false; render();
  });
}

/* ---------------------- Rendu général ------------------------------------ */
function render(){
  renderNav();
  const app = document.getElementById("app");

  if(animateurMode){
    app.innerHTML = stepBilan();
    bindBilan();
    return;
  }

  let html = "";
  let bind = ()=>{};
  switch(currentStep){
    case "pac": html = stepPAC(); bind = bindPAC; break;
    case "territoire": html = stepTerritoire(); bind = bindTerritoire; break;
    case "score": html = stepScore(); bind = bindScore; break;
    case "gonogo": html = stepGoNoGo(); bind = bindGoNoGo; break;
    case "agent": html = stepAgent(); bind = bindAgent; break;
    case "swot": html = stepSWOT(); bind = bindSWOT; break;
    case "mission": html = stepMission(); bind = bindMission; break;
  }
  html += `
  <div class="btn-row">
    <button class="btn" onclick="exportData()">Exporter (JSON)</button>
    <label class="btn secondary" style="cursor:pointer;">
      Importer
      <input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])">
    </label>
  </div>`;
  app.innerHTML = html;
  bind();
}

document.getElementById("btnAnimateur").addEventListener("click", ()=>{
  animateurMode = true; render(); window.scrollTo({top:0, behavior:"smooth"});
});

initTableName();
STATE = loadState();
render();
</script>
